name: Gemini audio end-to-end (experimental)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gemini-audio-e2e.yml'
      - 'scripts/emulator_audio_e2e.sh'
      - 'scripts/emulator_gemini_audio_e2e.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install speech synthesis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
      - name: Create deterministic synthetic speech
        run: |
          mkdir -p app/src/debug/assets
          espeak-ng -s 135 -w "$RUNNER_TEMP/whisproid-e2e-source.wav" 'Today is Monday and the sky is blue.'
          ffmpeg -hide_banner -loglevel error -y -i "$RUNNER_TEMP/whisproid-e2e-source.wav" \
            -f s16le -ar 16000 -ac 1 app/src/debug/assets/synthetic.pcm
      - name: Build debug app and test host
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          GOOGLE_AI_STUDIO_KEY: ${{ secrets.GOOGLE_AI_STUDIO_KEY }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -no-snapshot
          script: bash scripts/emulator_audio_e2e.sh
