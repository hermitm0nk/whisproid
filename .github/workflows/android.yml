name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$MANAGER"
          yes | "$MANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$MANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - run: ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Whisproid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Sign and verify production release APK
        if: github.event_name != 'pull_request'
        id: release-apk
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_KEY_ALIAS STORE_PASS KEY_PASS; do
            if [[ -z "${!name}" ]]; then
              echo "Missing $name signing secret; production release cannot use an ephemeral key."
              exit 1
            fi
          done
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS="$SDK_ROOT/build-tools/35.0.0"
          KEYSTORE="$RUNNER_TEMP/whisproid-production-signing.jks"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/app-release-aligned.apk"
          SIGNED_APK="$RUNNER_TEMP/whisproid-v0.2.1.apk"
          trap 'rm -f "$KEYSTORE" "$ALIGNED_APK"' EXIT
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          test -s "$UNSIGNED_APK"
          "$BUILD_TOOLS/zipalign" -f -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass "env:STORE_PASS" --key-pass "env:KEY_PASS" \
            --out "$SIGNED_APK" "$ALIGNED_APK"
          VERIFY_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --min-sdk-version 30 --verbose --print-certs "$SIGNED_APK")"
          printf '%s\n' "$VERIFY_OUTPUT"
          CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$VERIFY_OUTPUT" | head -1)"
          # Pin the first production signing identity. A newly supplied but
          # otherwise valid keystore must not silently break APK updates.
          test "${CERT_SHA256,,}" = "74b6afb68d2d58ab2d59a5fb07dba318158fd17c577b0465933d5895033b7858"
          PACKAGE="$("$BUILD_TOOLS/aapt" dump badging "$SIGNED_APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          test "$PACKAGE" = "dev.hermitm0nk.flowbubble"
          ANALYZER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/apkanalyzer' -type f | sort -V | tail -1)"
          test -x "$ANALYZER"
          DEBUGGABLE="$("$ANALYZER" manifest debuggable "$SIGNED_APK")"
          test "$DEBUGGABLE" = "false"
          if "$BUILD_TOOLS/aapt" dump xmltree "$SIGNED_APK" AndroidManifest.xml | grep -q 'TestBridgeReceiver'; then
            echo 'Release APK unexpectedly contains the debug test receiver'
            exit 1
          fi
          if unzip -l "$SIGNED_APK" | grep -q 'synthetic.pcm'; then
            echo 'Release APK unexpectedly contains the debug synthetic audio asset'
            exit 1
          fi
          test -s "$SIGNED_APK"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: Whisproid-production-release-apk
          path: ${{ steps.release-apk.outputs.apk }}
      - name: Wait for emulator and Gemini verification
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..80}; do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs" -X GET -f head_sha="$GITHUB_SHA" -f per_page=100)"
            pending=0
            for workflow in 'Android emulator tests' 'Gemini Live integration test' 'Gemini audio end-to-end (experimental)'; do
              result="$(jq -r --arg name "$workflow" '[.workflow_runs[] | select(.name == $name)] | sort_by(.created_at) | last | .conclusion // "pending"' <<< "$runs")"
              case "$result" in
                success) ;;
                pending) pending=1 ;;
                *) echo "Required workflow $workflow concluded $result"; exit 1 ;;
              esac
            done
            if [[ "$pending" == 0 ]]; then exit 0; fi
            sleep 30
          done
          echo 'Timed out waiting for required workflow checks'
          exit 1
      - name: Publish verified production release APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.release-apk.outputs.apk }}
        run: |
          RELEASE_TAG="v0.2.1"
          NOTES="Production-signed, non-debuggable release APK from commit $GITHUB_SHA. It uses the same pinned signing certificate as v0.2.0 and versionCode 5, so it updates v0.2.0 in place. Earlier v0.1.x test releases had ephemeral signing keys; uninstall those old builds once (copy transcript history first, since uninstall erases local data). Android 11/15/16 emulator and Gemini Live CI checks passed before publication."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
            target="$(jq -r '.target_commitish' <<< "$existing")"
            asset="$(jq -r --arg name "$(basename "$APK_PATH")" '[.assets[].name == $name] | any' <<< "$existing")"
            if [[ "$target" != "$GITHUB_SHA" || "$asset" != true ]]; then
              echo "Release $RELEASE_TAG already exists for a different commit or without the verified APK; bump versionCode/versionName and release tag."
              exit 1
            fi
            echo "Verified release $RELEASE_TAG already exists for this commit and APK"
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" --target "$GITHUB_SHA" --title "Whisproid $RELEASE_TAG" --notes "$NOTES"
          fi
