name: Android emulator tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb shell input keyevent 82
            adb shell wm dismiss-keyguard
            test_status=0
            ./gradlew connectedDebugAndroidTest --no-daemon || test_status=$?
            mkdir -p screenshots
            adb pull /sdcard/Android/data/dev.hermitm0nk.flowbubble/files/screenshots screenshots/api-${{ matrix.api-level }} || true
            adb exec-out screencap -p > screenshots/device-on-exit-api-${{ matrix.api-level }}.png || true
            exit $test_status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-results-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected/
            screenshots/
          if-no-files-found: warn
